    source: https://github.com/jbkunst/highcharter/blob/feat/highcharts-bundle/
authors:
  Joshua Kunst:
    href: https://jkunst.com
template:
  includes:
    in_header: |
      <!-- Google tag (gtag.js) -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-ECZ9XLT78C"></script>
  bootstrap: 5
  bslib:
    primary: '#47475C'
    heading_font:
      google:
        family: Alegreya Sans SC
        wght: 400
    base_font:
      google:
        family: IBM Plex Sans
        wght: [300, 400, 500]
    code_font:
      google: Fira Mono
