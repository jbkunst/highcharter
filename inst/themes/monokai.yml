# https://github.com/microsoft/vscode/blob/main/extensions/theme-monokai/themes/monokai-color-theme.json
colors: ['#F92672', '#66D9EF', '#A6E22E', '#FD971F']
chart:
  backgroundColor: '#272822'
  style:
    fontFamily: Inconsolata
    color: '#A2A39C'
title:
  style:
    color: '#A2A39C'
  align: left
subtitle:
  style:
    color: '#A2A39C'
  align: left
legend:
  align: right
  verticalAlign: bottom
  itemStyle:
    fontWeight: normal
    color: '#A2A39C'
xAxis:
  labels:
    style:
      color: '#A2A39C'
