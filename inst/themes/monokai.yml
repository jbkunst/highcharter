  lineColor: '#A2A39C'
  minorGridLineColor: '#A2A39C'
  tickColor: '#A2A39C'
  tickWidth: 1
yAxis:
  labels:
    style:
      color: '#A2A39C'
  title:
    style:
      color: '#A2A39C'
  gridLineDashStyle: Dot
  gridLineColor: '#A2A39C'
  lineColor: '#A2A39C'
  minorGridLineColor: '#A2A39C'
  tickColor: '#A2A39C'
  tickWidth: 1
