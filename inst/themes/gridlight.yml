# https://github.com/highcharts/highcharts-dist/blob/v12.6.0/es-modules/Extensions/Themes/GridLight.js
colors: ['#7CB5EC', '#F7A35C', '#90EE7E', '#7798BF', '#AAEEEE', '#FF0066',
  '#EEAAEE', '#55BF3B', '#DF5353', '#7798BF', '#AAEEEE']
chart:
  backgroundColor: null
  style:
    fontFamily: Dosis, sans-serif
title:
  style:
    fontSize: 16px
    fontWeight: bold
    textTransform: uppercase
tooltip:
  borderWidth: 0
  backgroundColor: rgba(219,219,216,0.8)
  shadow: false
legend:
  backgroundColor: '#F0F0EA'
  itemStyle:
    fontWeight: bold
    fontSize: 13px
xAxis:
  gridLineWidth: 1
  labels:
    style:
      fontSize: 12px
yAxis:
  minorTickInterval: auto
  title:
    style:
      textTransform: uppercase
  labels:
    style:
      fontSize: 12px
plotOptions:
  candlestick:
    lineColor: '#404048'
background2: '#F0F0EA'
