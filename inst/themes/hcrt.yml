symbols: [circle, circle, circle, circle, circle]
colors: ['#47475c', '#61BC7B', '#508CC8', '#F49952', '#9C9EDB', '#6699a1']
chart:
  style:
    fontFamily: IBM Plex Sans
    color: '#666666'
title:
  align: left
  style:
    fontFamily: Alegreya Sans SC
    fontSize: 24px
    fontWeight: normal
subtitle:
  align: left
  style:
    fontFamily: IBM Plex Sans
    fontSize: 16px
caption:
  style:
    fontFamily: IBM Plex Sans
    fontSize: 14px
credits:
  style:
    fontFamily: IBM Plex Sans
    fontSize: 10px
exporting:
  buttons:
    contextButton:
      symbol: menuball
legend:
  align: right
  verticalAlign: bottom
  itemStyle:
    fontWeight: normal
    color: '#666666'
xAxis:
  gridLineWidth: 1
  gridLineColor: '#F3F3F3'
  lineColor: '#F3F3F3'
  minorGridLineColor: '#F3F3F3'
  tickColor: '#F3F3F3'
  tickWidth: 1
yAxis:
  gridLineColor: '#F3F3F3'
  lineColor: '#F3F3F3'
  minorGridLineColor: '#F3F3F3'
  tickColor: '#F3F3F3'
  tickWidth: 1
plotOptions:
  series:
    dataLabels:
      style:
        fontWeight: normal
  line:
    marker:
      enabled: false
  spline:
    marker:
      enabled: false
  area:
    marker:
      enabled: false
  areaspline:
    marker:
      enabled: false
  arearange:
    marker:
      enabled: false
  bubble:
    maxSize: 10%
tooltip:
  className: highcharter-regular-tooltip
