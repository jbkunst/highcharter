# https://www.highcharts.com/demo/sparkline
# https://jkunst.com/blog/posts/2020-06-26-valuebox-and-sparklines/
chart:
  backgroundColor: null
  borderWidth: 0
  margin: [2, 0, 2, 0]
  style:
    overflow: visible
  skipClone: true
title:
  text: ''
xAxis:
  labels:
    enabled: false
  title:
    text: null
  startOnTick: false
  endOnTick: false
  tickPositions: []
yAxis:
  endOnTick: false
  startOnTick: false
  labels:
    enabled: false
  title:
    text: null
  tickPositions: []
tooltip:
  backgroundColor: null
  borderWidth: 0
  shadow: false
  useHTML: true
  hideDelay: 0
  shared: true
  padding: 0
  positioner: !js |-
    function (w, h, point) {
      return { x: point.plotX - w / 2, y: point.plotY - h };
    }
plotOptions:
  series:
    animation: false
    lineWidth: 1
    shadow: false
    states:
      hover:
        lineWidth: 1
    marker:
      radius: 1
      states:
        hover:
          radius: 2
    fillOpacity: 0.25
