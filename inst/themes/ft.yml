# Financial Times web background, categorical line and bar scales.
# https://ft-interactive.github.io/g-chartcolour/
colors: ['#0F5499', '#EB5E8D', '#70DCE6', '#9DBF57', '#208FCE', '#7F062E', '#C2B7AF', '#CE3140']
plotOptions:
  bar:
    colors: &bar_colors ['#1E558C', '#94D2E6', '#1E8FCC', '#B3325D', '#FF75A3', '#D9CCC3', '#AECC70', '#F34D5B']
  column:
    colors: *bar_colors
chart:
  backgroundColor: '#FFF1E5'
  style:
    fontFamily: Arial, sans-serif
title:
  align: left
  style:
    color: '#33302E'
    fontWeight: bold
subtitle:
  align: left
  style:
    color: '#33302E'
xAxis:
  lineColor: '#CCC1B7'
  tickLength: 0
  labels:
    style:
      color: '#33302E'
yAxis:
  gridLineColor: '#CCC1B7'
  labels:
    style:
      color: '#33302E'
legend:
  align: left
  itemStyle:
    color: '#33302E'
