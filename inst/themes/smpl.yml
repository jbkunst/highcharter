symbols: [circle, circle, circle, circle, circle]
# https://github.com/hrbrmstr/hrbrthemes
# https://materialui.co/flatuicolors
colors: ['#d35400', '#2980b9', '#2ecc71', '#f1c40f', '#2c3e50', '#7f8c8d']
chart:
  style:
    fontFamily: Roboto
    color: '#666666'
title:
  align: left
  style:
    fontFamily: Roboto Condensed
    fontWeight: normal
subtitle:
  align: left
  style:
    fontFamily: Roboto Condensed
legend:
  itemStyle:
    fontWeight: normal
  align: right
  verticalAlign: bottom
xAxis:
  gridLineWidth: 1
  gridLineColor: '#F3F3F3'
  lineColor: '#F3F3F3'
  minorGridLineColor: '#F3F3F3'
  tickColor: '#F3F3F3'
  tickWidth: 1
yAxis:
  gridLineColor: '#F3F3F3'
  lineColor: '#F3F3F3'
  minorGridLineColor: '#F3F3F3'
  tickColor: '#F3F3F3'
  tickWidth: 1
plotOptions:
  series:
    dataLabels:
      style:
        fontWeight: normal
  line:
    marker:
      enabled: false
  spline:
    marker:
      enabled: false
  area:
    marker:
      enabled: false
  areaspline:
    marker:
      enabled: false
  arearange:
    marker:
      enabled: false
  bubble:
    maxSize: 10%
tooltip:
  className: highcharter-regular-tooltip
