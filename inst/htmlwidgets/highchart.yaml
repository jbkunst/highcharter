dependencies:
  - name: jquery
    version: 3.5.1
    src: "htmlwidgets/lib/jquery"
    script: jquery.min.js
  - name: proj4js
    version: 2.3.15
    src: "htmlwidgets/lib/proj4js"
    script: proj4.js
  - name: highcharts
    version: 12.6.0
